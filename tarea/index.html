<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lista de tareas</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        margin: 0;
        padding: 24px;
      }
      main {
        max-width: 480px;
        margin: 0 auto;
        background: #fff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
      }
      h1 {
        margin-top: 0;
        font-size: 1.4rem;
      }
      form {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      label {
        width: 100%;
        font-weight: bold;
      }
      input[type="text"] {
        flex: 1;
        padding: 8px;
        border: 1px solid #aaa;
        border-radius: 4px;
      }
      button {
        padding: 6px 10px;
        border: 0;
        border-radius: 4px;
        background: #1f6feb;
        color: #fff;
        cursor: pointer;
      }
      button.borrar {
        background: #c62828;
      }
      #contador {
        width: 100%;
        margin: 0;
        font-size: 0.8rem;
        color: #555;
      }
      #mensaje {
        width: 100%;
        margin: 0;
        min-height: 1.2em;
        font-size: 0.9rem;
      }
      #mensaje.error {
        color: #c62828;
      }
      #mensaje.ok {
        color: #2e7d32;
      }
      ul {
        list-style: none;
        padding: 0;
      }
      li {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 0;
        border-bottom: 1px solid #e0e0e0;
      }
      li span {
        flex: 1;
      }
      li.hecha span {
        text-decoration: line-through;
        color: #888;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Lista de tareas</h1>

      <form id="formTarea" novalidate>
        <label for="inputTarea">Nueva tarea</label>
        <input
          id="inputTarea"
          type="text"
          maxlength="40"
          autocomplete="off"
          placeholder="Ej.: Repasar eventos del DOM"
        />
        <button type="submit">Agregar</button>
        <p id="contador">0 / 40</p>
        <p id="mensaje" role="alert"></p>
      </form>

      <p id="resumen"></p>
      <ul id="lista"></ul>
      <button id="btnLimpiar" type="button">Borrar completadas</button>
    </main>

    <script src="app.js"></script>
  </body>
</html>
